<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="rust-axum-api: a REST API in Rust with Axum, SQLx and SQLite">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#3b1f0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f74c00"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e8430c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#f74c00" stroke-opacity="0.18" stroke-width="2">
    <circle cx="1040" cy="160" r="70"/><circle cx="1040" cy="160" r="110"/><circle cx="1040" cy="160" r="150"/>
  </g>
  <g transform="translate(917 37) scale(0.48)">
  <!-- hexagon shell -->
  <path d="M256 28 L453 142 L453 370 L256 484 L59 370 L59 142 Z" fill="#1c1410" stroke="url(#g)" stroke-width="22" stroke-linejoin="round"/>
  <!-- "A" for API, its legs reach the hexagon like request routes -->
  <path d="M152 380 L256 128 L360 380" fill="none" stroke="url(#g)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- crossbar as a connection between two nodes -->
  <line x1="196" y1="296" x2="316" y2="296" stroke="#fff4ea" stroke-width="16" stroke-linecap="round"/>
  <circle cx="196" cy="296" r="22" fill="#fff4ea"/>
  <circle cx="316" cy="296" r="22" fill="#fff4ea"/>
  <circle cx="256" cy="128" r="26" fill="#fff4ea" stroke="url(#g)" stroke-width="10"/>
  </g>
  <text x="80" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="64" font-weight="700" fill="#fff">rust-axum-api</text>
  <rect x="80" y="165" width="220" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="220" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" fill="#e8d9cf">A fast, tested REST API in Rust</text>
  <text x="80" y="262" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#ffb347">axum · tokio · sqlx · sqlite</text>
</svg>
