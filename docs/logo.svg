<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="rust-axum-api logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e8430c"/>
    </linearGradient>
  </defs>
  <!-- hexagon shell -->
  <path d="M256 28 L453 142 L453 370 L256 484 L59 370 L59 142 Z" fill="#1c1410" stroke="url(#g)" stroke-width="22" stroke-linejoin="round"/>
