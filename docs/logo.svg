  <path d="M152 380 L256 128 L360 380" fill="none" stroke="url(#g)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- crossbar as a connection between two nodes -->
  <line x1="196" y1="296" x2="316" y2="296" stroke="#fff4ea" stroke-width="16" stroke-linecap="round"/>
  <circle cx="196" cy="296" r="22" fill="#fff4ea"/>
  <circle cx="316" cy="296" r="22" fill="#fff4ea"/>
  <circle cx="256" cy="128" r="26" fill="#fff4ea" stroke="url(#g)" stroke-width="10"/>
