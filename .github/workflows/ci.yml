name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t rust-axum-api .
      - name: Smoke test
        run: |
          docker run -d --name api -p 3000:3000 rust-axum-api
          for i in $(seq 30); do curl -sf localhost:3000/health && break; sleep 1; done
          curl -sf -X POST localhost:3000/todos -H 'content-type: application/json' -d '{"title":"docker"}'
